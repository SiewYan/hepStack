# Muon Toolkit Dependencies Configuration
# Platform-specific package dependencies

[debian]
name="Ubuntu/Debian"
packages="build-essential cmake ninja-build git curl libx11-dev libxext-dev libxft-dev libxpm-dev libssl-dev libgl1-mesa-dev libglu1-mesa-dev libxtst-dev libxmu-dev libxi-dev freeglut3-dev libgsl-dev libtbb-dev qtbase5-dev qt5-qmake gfortran python3 python3-dev python3-venv python3-pip autoconf automake libtool ocaml-nox ocaml-findlib zlib1g-dev libboost-all-dev"

[redhat]
name="Fedora/RHEL/CentOS"
packages="gcc-c++ cmake ninja-build git curl libX11-devel libXext-devel libXft-devel libXpm-devel openssl-devel mesa-libGL-devel mesa-libGLU-devel libXtst-devel libXmu-devel libXi-devel freeglut-devel gsl-devel tbb-devel qt5-qtbase-devel qt5-qtdeclarative-devel expat-devel gcc-gfortran python3 python3-devel python3-pip autoconf automake libtool ocaml ocaml-findlib zlib-devel boost-devel"

[macos]
name="macOS"
packages="ninja git curl xrootd qt@5 gcc python3 autoconf automake libtool ocaml opam gsl boost"
brew_packages="xquartz"

[arch]
name="Arch Linux"
packages="base-devel cmake ninja git curl xorg-server xorg-xrandr libx11 libxext libxft libxpm openssl mesa glu freeglut gsl tbb gcc-fortran python python-pip autoconf automake libtool ocaml ocaml-findlib zlib boost"

[versions]
#root="6.32.08"
#root="6.36.04"
root="6.38.06"
clhep="2.4.7.1"
#geant4="10.7.3"
geant4="11.3.2"
# --- Phenomenology / generator chain ---
lhapdf="6.5.4"
pythia8="8312"
delphes="3.5.1"
madgraph="3.7.2"
whizard="3.1.5"
calchep="3.9.2"
herwig="7.3.0"
# --- Analysis, recasting & limits ---
madanalysis="1.10.12"
rivet="3.1.10"
checkmate="2.0.37"
# pip-installed tools (version = pip spec; empty means latest)
contur="3.0.0"
pyhf="0.7.6"
spey="0.2.0"

[python]
# Miniforge (mamba) provides the Python used by all builds.
# miniforge release tag, or "latest"
miniforge="latest"
# python version pinned into the miniforge base env
python="3.11"
# python packages needed by the builds (PyROOT, LHAPDF bindings, MadGraph,
# MadAnalysis5 plotting, Delphes/ROOT interop)
packages="numpy scipy matplotlib pyyaml six cython lxml pip"

[build]
default_prefix="./local"
default_build_dir="./build"
